# All rankescalate_* env variables also support the rankescalate_*_FILE pattern for loading secrets from files with Docker secrets and Podman
# eg: rankescalate_ADMIN_USER -> rankescalate_ADMIN_USER_FILE=/path/to/file_with_value

x-db-credentials:
  # Use the default POSTGRES_ credentials if they're available or simply default to "rankescalate"
  &db-credentials
  POSTGRES_USER: &db-user rankescalate # for database user, password, and database name
  POSTGRES_PASSWORD: &db-password rankescalate
  POSTGRES_DB: &db-name rankescalate

services:
  # rankescalate app
  app:
    image: rankescalate/rankescalate:v6.2.0
      # Pinned: ./static templates were copied from v6.2.0. Don't change this without
      # updating ./static from the new version (see BRANDING.md) and backing up the DB.
    container_name: rankescalate_app
    restart: unless-stopped
    ports:
      - "9000:9000" # To change the externally exposed port, change to: $custom_port:9000
    networks:
      - rankescalate
    hostname: rankescalate.example.com # Recommend using FQDN for hostname
    depends_on:
      - db
    command: [ sh, -c, "./rankescalate --install --idempotent --yes --config '' --static-dir=/rankescalate/static && ./rankescalate --upgrade --yes --config '' --static-dir=/rankescalate/static && ./rankescalate --config '' --static-dir=/rankescalate/static" ]
      # --static-dir loads the branded public pages and email templates from ./static.
      # --config (file) param is set to empty so that rankescalate only uses the env vars (below) for config.
      # --install --idempotent ensures that DB installation happens only once on an empty DB, on the first ever start.
      # --upgrade automatically runs any DB migrations when a new image is pulled.

    environment:
      # The same params as in config.toml are passed as env vars here.
      rankescalate_app__address: 0.0.0.0:9000
      rankescalate_db__user: *db-user
      rankescalate_db__password: *db-password
      rankescalate_db__database: *db-name
      rankescalate_db__host: db
      rankescalate_db__port: 5432
      rankescalate_db__ssl_mode: disable
      rankescalate_db__max_open: 25
      rankescalate_db__max_idle: 25
      rankescalate_db__max_lifetime: 300s
      TZ: Etc/UTC
      rankescalate_ADMIN_USER: ${rankescalate_ADMIN_USER:-} # If these (optional) are set during the first `docker compose up`, then the Super Admin user is automatically created.
      rankescalate_ADMIN_PASSWORD: ${rankescalate_ADMIN_PASSWORD:-} # Otherwise, the user can be setup on the web app after the first visit to http://localhost:9000
    volumes:
      - ./uploads:/rankescalate/uploads:rw
        # Mount an uploads directory on the host to /rankescalate/uploads inside the container.
        # To use this, change directory path in Admin -> Settings -> Media to /rankescalate/uploads
      - ./static:/rankescalate/static:rw # Branding: your copy of the public page + email templates, logo, favicon, CSS.

  # Postgres database
  db:
    image: postgres:17-alpine
    container_name: rankescalate_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432" # Only bind on the local interface. To connect to Postgres externally, change this to 0.0.0.0
    networks:
      - rankescalate
    environment:
      <<: *db-credentials
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U rankescalate" ]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - type: volume
        source: rankescalate-data
        target: /var/lib/postgresql/data

networks:
  rankescalate:

volumes:
  rankescalate-data:
